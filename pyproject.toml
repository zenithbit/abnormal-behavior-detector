[project]
name = "abd"
version = "0.1.0"
description = "Abnormal behavior detection in video (video-level anomaly + behavior class)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.2",
    "lap>=0.5.12",          # ByteTrack assignment (ultralytics tries to pip-install it at runtime otherwise)
    "opencv-python>=4.8",
    "imageio-ffmpeg",       # bundled ffmpeg: re-encode renders to H.264 so any player opens them
    "numpy",
    "scikit-learn",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
abd = "abd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
